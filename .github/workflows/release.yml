# Gera uma versão nova do executável e publica como Release no GitHub.
# Para lançar:  git tag -a v1.3.0 -m "O que mudou nesta versão"  &&  git push origin v1.3.0
# Os programas já instalados acham a Release e oferecem a atualização (Desktop/AppUpdater.cs).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Versão a partir da tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$tag' fora do formato vX.Y.Z" }
          "version=$version" >> $env:GITHUB_OUTPUT
          # O checkout traz a tag sem a mensagem; busca de novo para usar a mensagem como notas da versão.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git tag -l --format='%(contents)' $tag | Out-File -Encoding utf8 release-notes.md

      - name: Testes do backend
        run: dotnet test backend/CyberpunkDb.sln -c Release

      - name: Testes do frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Executável
        shell: pwsh
        run: ./deploy/desktop/publicar.ps1 -Versao ${{ steps.version.outputs.version }} -Repositorio ${{ github.repository }}

      - uses: softprops/action-gh-release@v2
        with:
          name: Night City Item Database ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            artifacts/NightCityItemDB.exe
            artifacts/NightCityItemDB.exe.sha256
            artifacts/NightCityItemDB-win-x64.zip
