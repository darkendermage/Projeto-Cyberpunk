# PostgreSQL para desenvolvimento local: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberpunkdb-postgres
    environment:
      POSTGRES_DB: cyberpunkdb
      POSTGRES_USER: cyberpunk
      POSTGRES_PASSWORD: cyberpunk
    ports:
      - "5432:5432"
    volumes:
      - cyberpunkdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberpunk -d cyberpunkdb"]
      interval: 5s
      retries: 10

volumes:
  cyberpunkdb-data:
